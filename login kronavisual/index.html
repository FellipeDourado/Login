<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="reset.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>Login</title>
</head>

<body>
    <header>
    <nav>
    <img id="logo" class="logo" src="./assetslogin/logo branca.png" alt="Logo Fellipe">
        </nav>
    </header>

    <main>
    <div class="card_box"> <img id="banner_login" class="banner_login" src="assetslogin/banner_login on.png" alt="Banner Login">
    <div class="formulario_box">
        <div class="titulo">
    <h1>Login</h1>
    
    <button id="tema" class="tema">🌙</button>
</div>
        <div class="campo">
        <input id="usuario" type="text" placeholder="Digite seu usuário"> <img id="icone_usuario" class="icone_usuario" src="./assetslogin/usuario_dark.png" alt="Ícone de usuário"> </div>
        <div class="campo">
        <input id="senha"  type="password" placeholder="Digite sua senha"> <img id="icone_senha" class="icone_senha" src="./assetslogin/senha_dark.png" alt="Ícone de senha">
    </div>
    <div class="opcoes"> 
        <div class="lembrar"> <input type="checkbox" id="lembrar">
        <label for="lembrar">Lembrar-me</label>
        </div>
        <a href="#" class="esqueci-senha">Esqueci minha senha</a></div>
    <button id="entrar" class="entrar" type="submit">
    <span class="texto">Entrar</span>
    <span class="wave"></span>
    </button>
    </div>
    </div>
    </main>
    <footer>
        <p class="direitos">© 2026 Fellipe Dourado. Todos os direitos reservados.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
